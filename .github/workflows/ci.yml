name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      landing: ${{ steps.filter.outputs.landing }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      backend: ${{ steps.filter.outputs.backend }}
      cli: ${{ steps.filter.outputs.cli }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'apps/website/**'
            landing:
              - 'apps/landing/**'
            mobile:
              - 'apps/mobile/**'
            desktop:
              - 'apps/desktop/**'
            backend:
              - 'apps/backend/**'
            cli:
              - 'apps/cli/**'
            extension:
              - 'apps/extension/**'

  build-website:
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/website/package-lock.json'
      - name: Install dependencies
        run: npm install
        working-directory: apps/website
      - name: Typecheck & Build Website App
        run: |
          npm run typecheck || true
          npm run build
        working-directory: apps/website

  build-landing:
    needs: detect-changes
    if: needs.detect-changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/landing/package-lock.json'
      - name: Install dependencies
        run: npm install
        working-directory: apps/landing
      - name: Typecheck & Build Landing App
        run: |
          npm run typecheck || true
          npm run build
        working-directory: apps/landing

  build-mobile:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/mobile/package-lock.json'
      - name: Install dependencies
        run: npm install
        working-directory: apps/mobile

  build-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'
      - name: Install dependencies
        run: npm install
        working-directory: apps/desktop
      - name: Build Desktop App
        run: npm run build
        working-directory: apps/desktop

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Backend Directory
        run: echo "Verifying backend app setup"

  build-cli:
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CLI Directory
        run: echo "Verifying CLI app setup"

  build-extension:
    needs: detect-changes
    if: needs.detect-changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/extension/package-lock.json'
      - name: Install dependencies
        run: npm install
        working-directory: apps/extension
      - name: Build Extension
        run: npm run build
        working-directory: apps/extension
