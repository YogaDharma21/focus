version: '3.8'

services:
  landing:
    build:
      context: ..
      dockerfile: docker/Dockerfile.landing
    container_name: focus-landing
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: focus-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: focus-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
